<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Coran</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:#f5efe3;color:#222;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.hidden{display:none !important}
.screen{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;gap:18px;
  padding:18px;
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.app-title{text-align:center;font-size:clamp(30px,8vw,44px);color:#0f3d2e}
.dl{text-align:center;font-size:clamp(17px,4.5vw,22px);color:#666;font-weight:600}
.dl.done{color:#0e6b4e}
.msg{text-align:center;font-size:clamp(24px,6.5vw,32px);color:#8c2f1b;font-weight:800}
.msg.info{color:#555}
.big-btn{
  flex:1;min-height:190px;border:none;border-radius:28px;color:#fff;
  font-family:inherit;font-weight:800;font-size:clamp(36px,10.5vw,60px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 8px 0 rgba(0,0,0,.28);cursor:pointer;
}
.big-btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.big-btn .icon{font-size:1.3em;line-height:1}
.big-btn .sub{font-size:.42em;font-weight:600;opacity:.92}
.btn-yaseen{background:#0e6b4e}
.btn-quran{background:#8a5b12}
.big-btn.playing{background:#a63d2a}
</style>
</head>
<body>

<main class="screen">
  <h1 class="app-title">Coranul</h1>
  <div id="dlStatus" class="dl hidden"></div>
  <div id="msg" class="msg hidden"></div>
  <button id="btnYaseen" class="big-btn btn-yaseen">
    <span class="icon" id="icoYaseen">▶</span>
    <span>Sura Yasin</span>
  </button>
  <button id="btnQuran" class="big-btn btn-quran">
    <span class="icon" id="icoQuran">▶</span>
    <span>Coranul complet</span>
    <span class="sub" id="partLabel"></span>
  </button>
  <audio id="audio" preload="auto" playsinline></audio>
</main>

<script>
// ==========================================================
//  AUDIO FILES (generated by .work/pipeline.sh)
//  yaseen: one file; quran: 1-hour chunks played back-to-back
// ==========================================================
const QURAN_SEGMENTS = 44;
const QURAN_FILES = [];
for (let i = 1; i <= QURAN_SEGMENTS; i++) {
  QURAN_FILES.push('audio/quran-' + String(i).padStart(3, '0') + '.m4a');
}
const CONTENT = {
  yaseen: { title: 'Sura Yasin', files: ['audio/yaseen.m4a'] },
  quran:  { title: 'Coranul complet', files: QURAN_FILES },
};
const RESUME_REWIND_SECONDS = 5;
const SAVE_EVERY_MS = 5000;
const AUDIO_CACHE = 'quran-audio-v1';

const $ = (id) => document.getElementById(id);
const audio = $('audio');
const msgEl = $('msg'), partEl = $('partLabel'), dlEl = $('dlStatus');
const BTN = { yaseen: $('btnYaseen'), quran: $('btnQuran') };
const ICO = { yaseen: $('icoYaseen'), quran: $('icoQuran') };

let currentKey = null;
let currentIndex = 0;
let seekOnLoad = 0;
let suppressSave = false;   // true while switching segments/chapters
let lastSaveMs = 0;

// ---------- progress memory ----------
function storageId(key){ return 'quran-progress-' + key; }
function loadProgress(key){
  try {
    const p = JSON.parse(localStorage.getItem(storageId(key)));
    const cfg = CONTENT[key];
    // p.v ties the saved position to a specific file, so regenerating the
    // audio later resets stale progress instead of resuming mid-wrong-file.
    if (p && Number.isFinite(p.i) && Number.isFinite(p.t) && p.i >= 0 && p.t >= 0 &&
        p.i < cfg.files.length && (!p.v || p.v === cfg.files[p.i])) return p;
  } catch (e) {}
  return { i: 0, t: 0 };
}
function saveProgress(key, i, t){
  try {
    localStorage.setItem(storageId(key), JSON.stringify({ i: i, t: t, v: CONTENT[key].files[i], at: Date.now() }));
  } catch (e) {}
}
function saveNow(){
  if (!currentKey || suppressSave) return;
  const t = audio.currentTime;
  if (Number.isFinite(t) && t > 0 && !audio.ended) saveProgress(currentKey, currentIndex, t);
}

// ---------- UI ----------
function setButtonsUI(playing){
  for (const key of ['yaseen', 'quran']) {
    const active = currentKey === key && playing;
    BTN[key].classList.toggle('playing', active);
    ICO[key].textContent = active ? '⏸' : '▶';
  }
  updatePartLabel();
}
function updatePartLabel(){
  const total = CONTENT.quran.files.length;
  const idx = currentKey === 'quran' ? currentIndex : loadProgress('quran').i;
  partEl.textContent = 'Partea ' + (idx + 1) + ' din ' + total;
}
function showMsg(text, info){
  msgEl.textContent = text;
  msgEl.className = 'msg' + (info ? ' info' : '');
}
function hideMsg(){ msgEl.className = 'msg hidden'; }

// ---------- playback ----------
function onChapterTap(key){
  if (currentKey === key) {
    if (!audio.paused && !audio.ended) { audio.pause(); return; }  // pause handler saves
    if (audio.error || audio.ended) { startChapter(key); return; } // reload after error / full completion
    const pr = audio.play();
    if (pr && pr.catch) pr.catch(() => { setButtonsUI(false); });
    return;
  }
  saveNow(); // save the old chapter's spot before switching
  startChapter(key);
}

function startChapter(key){
  suppressSave = true;
  currentKey = key;
  const cfg = CONTENT[key];
  const p = loadProgress(key);
  currentIndex = Math.min(p.i, cfg.files.length - 1);
  const start = Math.max(0, p.t - RESUME_REWIND_SECONDS);
  showMsg('Se încarcă…', true);
  setButtonsUI(false);
  loadSegment(currentIndex, start);
}

function loadSegment(idx, startAt){
  suppressSave = true;
  seekOnLoad = startAt || 0;
  audio.src = CONTENT[currentKey].files[idx];
  const pr = audio.play();
  if (pr && pr.catch) pr.catch(() => { setButtonsUI(false); });
}

audio.addEventListener('loadedmetadata', () => {
  if (seekOnLoad > 0) { try { audio.currentTime = seekOnLoad; } catch (e) {} }
  seekOnLoad = 0;
  suppressSave = false;
});
audio.addEventListener('playing', () => {
  hideMsg();
  setButtonsUI(true);
  updateMediaSession();
});
audio.addEventListener('pause', () => {
  setButtonsUI(false);
  saveNow();
});
audio.addEventListener('timeupdate', () => {
  if (audio.paused) return;
  const now = Date.now();
  if (now - lastSaveMs >= SAVE_EVERY_MS) { lastSaveMs = now; saveNow(); }
});
audio.addEventListener('ended', () => {
  const cfg = CONTENT[currentKey];
  if (!cfg) return;
  if (currentIndex < cfg.files.length - 1) {
    // next part, seamlessly
    currentIndex++;
    saveProgress(currentKey, currentIndex, 0);
    updatePartLabel();
    loadSegment(currentIndex, 0);
  } else {
    // everything finished: reset memory to the beginning and stop
    currentIndex = 0;
    saveProgress(currentKey, 0, 0);
    setButtonsUI(false);
  }
});
// No auto-skip on error: skipping would move the saved position and lose
// her place. Show a message; the next tap on the button retries.
audio.addEventListener('error', () => {
  if (!currentKey) return;
  setButtonsUI(false);
  showMsg('Problemă la redare — apasă din nou pe buton');
});

BTN.yaseen.addEventListener('click', () => onChapterTap('yaseen'));
BTN.quran.addEventListener('click', () => onChapterTap('quran'));

// ---------- lock-screen controls ----------
function updateMediaSession(){
  if (!('mediaSession' in navigator)) return;
  const cfg = CONTENT[currentKey];
  const multi = cfg.files.length > 1;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: cfg.title + (multi ? ' — partea ' + (currentIndex + 1) + ' din ' + cfg.files.length : ''),
      artist: 'Coran',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    // Route through onChapterTap so lock-screen Play gets the same
    // ended/error recovery as the on-screen button (reload, not raw play).
    navigator.mediaSession.setActionHandler('play', () => { if (currentKey) onChapterTap(currentKey); });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
  } catch (e) {}
}

// ---------- save on close / background ----------
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});
window.addEventListener('pagehide', saveNow);

// ---------- offline download of all audio ----------
let dlRunning = false;
async function ensureOfflineAudio(){
  if (dlRunning || !('caches' in window)) return;
  dlRunning = true;
  try {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    const all = CONTENT.yaseen.files.concat(CONTENT.quran.files);
    const cache = await caches.open(AUDIO_CACHE);
    const missing = [];
    for (const f of all) {
      if (!(await cache.match(f))) missing.push(f);
    }
    if (!missing.length) {
      dlEl.textContent = '✓ Disponibil offline';
      dlEl.classList.remove('hidden');
      dlEl.classList.add('done');
      return;
    }
    const total = all.length;
    for (let k = 0; k < missing.length; k++) {
      dlEl.textContent = 'Se descarcă pentru offline: ' + (total - missing.length + k + 1) + ' din ' + total;
      dlEl.classList.remove('hidden');
      dlEl.classList.remove('done');
      // This app used to be served from the folder above. If the audio is
      // already on the phone under its old address, move it across instead
      // of downloading three quarters of a gigabyte a second time.
      const legacy = new URL('../' + missing[k], location.href).href;
      const salvaged = await cache.match(legacy);
      if (salvaged) {
        await cache.put(missing[k], salvaged);
        await cache.delete(legacy);
        continue;
      }
      if (!navigator.onLine) {
        dlEl.textContent = 'Descărcarea continuă la următoarea deschidere';
        return;
      }
      const resp = await fetch(missing[k]);
      if (!resp.ok) throw new Error('http ' + resp.status);
      await cache.put(missing[k], resp);
    }
    dlEl.textContent = '✓ Disponibil offline';
    dlEl.classList.add('done');
  } catch (e) {
    dlEl.textContent = 'Descărcarea continuă la următoarea deschidere';
    dlEl.classList.remove('hidden');
  } finally {
    dlRunning = false;
  }
}

// No "offline" banner: once the audio is cached, offline is the normal,
// fully-working state — a red warning there would only scare her.
window.addEventListener('online', ensureOfflineAudio);

setButtonsUI(false);
ensureOfflineAudio();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // No auto-reload here: a reload would cut the recitation off mid-verse.
  // A new version installs quietly and appears the next time she opens it.
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then((reg) => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    })
    .catch(() => {});
}
</script>
</body>
</html>
